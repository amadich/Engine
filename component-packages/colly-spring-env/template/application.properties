# Loaded by Spring Boot from ./config/ when the server runs from the project root.
# Environment variables and command-line arguments can override these values.
server.port=8080
jeridi.auth.cookie=false
jeridi.auth.cookie-secure=true
jeridi.auth.ttl-seconds=3600
jeridi.auth.cors-origin=http://127.0.0.1:3000
spring.jpa.hibernate.ddl-auto=none
jeridi.rooms.path=/api/v1/rooms
